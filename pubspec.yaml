name: qshare
description: "QShare — مشاركة ملفات بسيطة: استلام وإرسال عبر QR"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0
  cupertino_icons: ^1.0.8
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.5.0
  file_picker: ^13.4.0
  permission_handler: ^12.0.1
  archive: ^4.7.1
  path_provider: ^2.1.6
  dio: ^5.11.1
  shared_preferences: ^2.5.6
  uuid: ^4.6.0
  path: ^1.9.1
  flutter_localizations:
    sdk: flutter
  cupertino_ui: ^1.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
  fonts:
    - family: Tajawal
      fonts:
        - asset: assets/fonts/Tajawal-Regular.ttf
          weight: 400
        - asset: assets/fonts/Tajawal-Medium.ttf
          weight: 500
        - asset: assets/fonts/Tajawal-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/logo.png"
  background_color: "#0D7377"
  theme_color: "#0D7377"
